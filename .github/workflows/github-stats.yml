name: Generate GitHub Stats Images

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    name: Generate GitHub Stats Images
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Clone stats generator source
        run: git clone --depth 1 https://github.com/jstrieb/github-stats.git generator

      - name: Install dependencies
        run: pip install -r generator/requirements.txt

      - name: Generate stats images
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          GITHUB_ACTOR: NSK-394
          EXCLUDED: ""
          EXCLUDED_LANGS: ""
          EXCLUDE_FORKED_REPOS: "false"
        run: |
          cd generator
          python3 main.py
          mkdir -p ../generated
          cp -r generated/* ../generated/

      - name: Commit generated images
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update generated GitHub stats images"
          file_pattern: "generated/*.svg"
